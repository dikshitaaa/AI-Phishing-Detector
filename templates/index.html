<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Pro | AI Threat Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --safe-green: #238636;
            --danger-red: #da3633;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 0%, #1f2937 0%, transparent 50%);
        }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 10px; letter-spacing: -0.5px;}
        .header p { color: var(--text-muted); font-size: 15px; }
        
        .search-container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        .input-wrapper {
            display: flex;
            gap: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 5px;
            transition: border-color 0.3s;
        }
        .input-wrapper:focus-within { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2); }
        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        button {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 0 25px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #79c0ff; }

        /* Results Dashboard */
        #results {
            display: none;
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease;
        }
        .result-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
        .status-badge { padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 14px; letter-spacing: 0.5px;}
        .status-safe { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid #238636; }
        .status-danger { background: rgba(218, 54, 51, 0.2); color: #f85149; border: 1px solid #da3633; }
        
        .score-container { display: flex; align-items: center; gap: 10px; }
        .score-circle {
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; font-weight: 700; color: #fff;
            border: 4px solid var(--border-color);
        }
        
        .grid-details { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .detail-card { background: var(--bg-color); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        .detail-card h4 { color: var(--text-muted); font-size: 12px; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px;}
        .detail-card p { color: #fff; font-size: 15px; }
        
        ul.reasons { list-style: none; }
        ul.reasons li { margin-bottom: 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        ul.reasons li::before { content: "•"; color: var(--danger-red); font-size: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) { .grid-details { grid-template-columns: 1fr; } .result-header { flex-direction: column; gap: 15px; align-items: flex-start;} }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ PhishGuard <span style="color: var(--accent-blue);">Pro</span></h1>
        <p>Advanced AI Threat Intelligence & URL Scanner</p>
    </div>

    <div class="search-container">
        <div class="input-wrapper">
            <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off">
            <button onclick="scanURL()">Scan Now</button>
        </div>
    </div>

    <div id="results">
        <div class="result-header">
            <div>
                <h2 id="scannedUrl" style="font-size: 18px; color: #fff; margin-bottom: 5px; word-break: break-all;"></h2>
                <div id="liveStatus" style="font-size: 13px; color: var(--text-muted);">Checking status...</div>
            </div>
            <div class="score-container">
                <div id="riskScoreCircle" class="score-circle">0</div>
                <div id="statusBadge" class="status-badge">UNKNOWN</div>
            </div>
        </div>
        
        <div class="grid-details">
            <div class="detail-card">
                <h4>Threat Analysis</h4>
                <ul id="reasonsList" class="reasons"></ul>
            </div>
            <div class="detail-card">
                <h4>AI Model Verdict</h4>
                <p id="aiVerdict" style="font-weight: 600;"></p>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 10px;">Analyzed using Random Forest Classifier (91.5% Accuracy)</p>
            </div>
        </div>
    </div>

    <script>
        async function scanURL() {
            const url = document.getElementById('urlInput').value;
            if(!url) return alert("Please enter a URL");

            document.getElementById('scannedUrl').innerText = url;
            document.getElementById('results').style.display = 'block';
            document.getElementById('aiVerdict').innerText = "Analyzing...";

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await response.json();

                if(data.error) return alert(data.error);

                // Update UI
                document.getElementById('liveStatus').innerText = "Live Status: " + data.live_status;
                
                const badge = document.getElementById('statusBadge');
                const circle = document.getElementById('riskScoreCircle');
                const verdict = document.getElementById('aiVerdict');
                
                if(data.status === 'Phishing') {
                    badge.className = 'status-badge status-danger';
                    badge.innerText = 'PHISHING DETECTED';
                    verdict.innerText = "❌ High Risk";
                    verdict.style.color = '#f85149';
                    circle.style.borderColor = '#da3633';
                    circle.style.color = '#f85149';
                } else {
                    badge.className = 'status-badge status-safe';
                    badge.innerText = 'SECURE';
                    verdict.innerText = "✅ Safe";
                    verdict.style.color = '#3fb950';
                    circle.style.borderColor = '#238636';
                    circle.style.color = '#3fb950';
                }

                circle.innerText = data.score;

                const list = document.getElementById('reasonsList');
                list.innerHTML = '';
                data.reasons.forEach(reason => {
                    const li = document.createElement('li');
                    li.innerText = reason;
                    list.appendChild(li);
                });

            } catch (error) {
                console.error(error);
                alert("Error scanning URL.");
            }
        }
    </script>
</body>
</html>
